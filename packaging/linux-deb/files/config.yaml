# Odoo.ErpNet.FP — конфигурация (пакет odoo-erpnet-fp). Пазена при обновяване.
# След промяна: sudo systemctl restart odoo-erpnet-fp
server:
  host: "127.0.0.1"          # 0.0.0.0 ако касата в браузъра е на друга машина
  port: 8001
  log_level: INFO
  tls:
    enabled: false

