[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-erpnet-fp"
version = "0.24.3"
description = "Python drop-in replacement for ErpNet.FP HTTP fiscal-printer server, oriented for the Bulgarian POS market"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Rosen Vladimirov", email = "vladimirov.rosen@gmail.com" }]
keywords = ["odoo", "erpnet", "fiscal-printer", "bulgaria", "datecs", "pos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "evdev>=1.6 ; sys_platform == 'linux'",
    "pyudev>=0.24 ; sys_platform == 'linux'",  # hot-plug autodetect of CDC ACM scanners
    "httpx>=0.26",  # used by webhook poster + tests
    "prometheus_client>=0.19",  # /metrics endpoint
    "docker>=7.0",  # /admin/self-update — spawns watchtower one-shot
]

[project.optional-dependencies]
# ONVIF-native ANPR events + Device IO relay / PTZ control. Lazy-
# imported — pure-fiscal deployments never load it. Only needed for
# Profile-M edge-ANPR cameras (Axis/Milesight/Hanwha) or ONVIF relay
# barrier control. Hikvision/Dahua HTTP-listener path needs nothing.
onvif = [
    "onvif-zeep>=0.2.12",
]
# GPIO barrier actuator on a Pi/SBC at the gate (Phase B). Lazy —
# only the gpio access driver needs it; relay_tcp/onvif need nothing.
gpio = [
    "gpiozero>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.3",
]
# ZEN/GoRules decision-table evaluator. Lazy-imported в proxy/access/
# context_builder.py — pure-fiscal deployments never need it. Activates
# offline access decisions: same JSON graph from Odoo, < 1ms eval.
zen = [
    "zen-engine>=0.30",
]
# CFX-IPC (IPC-2591) machine-data ingest. Lazy-imported by the
# `drivers/cfx` listener — pure-fiscal/POS deployments never load it and
# stay byte-identical. Two AMQP libs:
#   * rabbitmq-amqp-python-client — AMQP 1.0 broker transport;
#   * python-qpid-proton — the AMQP 1.0 P2P transport AND (currently) a
#     HARD import-time dep: the SDK's `server/__init__.py` eagerly does
#     `from . import amqp` → `from proton import Delivery`, so importing
#     `server.cfx_plugin` fails without proton even for broker-only use.
# NB: the ipc-cfx SDK itself (repo `~/Проекти/amqp/proton-amqp`, package
# `lib.cfx` + top-level `server`) is NOT on PyPI — install it separately
# (`pip install -e <amqp>/proton-amqp`) OR point each station's
# `sdk_path:` at `<amqp>/proton-amqp/src` so the listener adds it to
# sys.path at start.
cfx = [
    # Pinned below 1.0: the 1.x line is a major rewrite and the broker
    # transport is driven by the ipc-cfx SDK (not vendored here), so a
    # rebuild must not silently swap it under a live PARMI endpoint.
    # Lift the cap only after testing `transport: broker` against 1.x.
    "rabbitmq-amqp-python-client>=0.8.0,<1.0",
    "python-qpid-proton>=0.39",
    # AMQP 0-9-1 transport for RabbitMQ 3.x brokers (Europlacer PROMON) —
    # the 1.0 client refuses <4.0 and the 3.x amqp1.0 plugin won't deliver
    # to a qpid-proton receiver, so 3.x sources are consumed over 0-9-1.
    "pika>=1.3",
]

# Външна база като източник на събития (Test Adapter на MS SQL и др.).
# Ленив импорт: `drivers/dbsource/poller.py` вика `create_engine` ВЪТРЕ в
# метода, тъй че чисто фискална инсталация никога не зарежда SQLAlchemy и
# остава байт за байт същата.
#
# Защо синхронни драйвери, а не async: еднакъв async път през трите бази е
# невъзможен — за MS SQL остава `aioodbc`, който сам е обвивка около
# `pyodbc` в нишка. Затова един синхронен път за трите, изнесен в нишка с
# `anyio.to_thread`.
#
# `pymssql` носи FreeTDS в колелото, тоест НИЩО не влиза в образа. Смяната
# към `pyodbc` (официалният път на Microsoft, нужен за Azure AD) е един ред
# в URL-а, но иска репозиторий на Microsoft и приемане на лиценз в билда.
dbsource = [
    "SQLAlchemy>=2.0,<3.0",
    "pymssql>=2.3",
    # Отключи при нужда от MySQL/MariaDB или Postgres източник:
    # "PyMySQL>=1.1",
    # "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://github.com/rosenvladimirov/Odoo.ErpNet.FP"
Repository = "https://github.com/rosenvladimirov/Odoo.ErpNet.FP"
Issues = "https://github.com/rosenvladimirov/Odoo.ErpNet.FP/issues"

[project.scripts]
odoo-erpnet-fp = "odoo_erpnet_fp.server.main:cli"

[tool.setuptools.packages.find]
include = ["odoo_erpnet_fp*"]
exclude = ["tests*", "docs*", "docker*"]

[tool.setuptools.package-data]
"odoo_erpnet_fp.drivers.fiscal.datecs_pm" = ["data/*.csv"]
"odoo_erpnet_fp.server" = ["static/*.html", "static/*.css", "static/*.js"]
# NDA DatecsPay pinpad native lib — explicit package-data so `pip install`
# bundles it into site-packages (it is .gitignored, so VCS-based inclusion
# would skip it). Without this the installed package has no .so and the
# driver fails to load at runtime even though the source tree has it.
"odoo_erpnet_fp.drivers.pinpad.datecs_pay" = ["lib/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
